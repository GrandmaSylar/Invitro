version: '3.8'

services:
  invitro-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invitro-mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=InvitroLims@2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - invitro_mssql_data:/var/opt/mssql

volumes:
  invitro_mssql_data:
    driver: local
